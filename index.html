<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>配車管理アプリ</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 0;
  background: #f5f5f5;
}
header {
  background: #1976d2;
  color: white;
  padding: 12px;
  text-align: center;
  font-size: 18px;
}
nav {
  display: flex;
  gap: 8px;
  padding: 10px;
}
button {
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  background: #1976d2;
  color: white;
  cursor: pointer;
}
button.secondary {
  background: #555;
}
section {
  display: none;
  padding: 12px;
}
section.active {
  display: block;
}
.card {
  background: white;
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 10px;
}
.list-item {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid #eee;
}
.list-item:last-child {
  border-bottom: none;
}
.small {
  font-size: 12px;
  color: #666;
}
</style>
</head>
<body>

<header>配車管理アプリ</header>

<nav>
  <button onclick="showSection('list')">一覧</button>
  <button onclick="createNew()">＋ 新しい配車を作成</button>
  <button class="secondary" onclick="showSection('master')">マスター管理</button>
</nav>

<!-- 一覧 -->
<section id="list" class="active"></section>

<!-- 編集 -->
<section id="editor"></section>

<!-- マスター -->
<section id="master"></section>

<script>
/* =====================
   マスター（確定版）
===================== */

const playersMaster = [
  { name:"小路口 悠太郎", grade:5 },
  { name:"杉山 朔弥", grade:5 },
  { name:"武田 諒太郎", grade:5 },
  { name:"近藤 諒平", grade:5 },
  { name:"畑本 颯太", grade:5 },

  { name:"長谷 紘希", grade:4 },
  { name:"杉野森 絃", grade:4 },
  { name:"菅原 奏奈", grade:4 },
  { name:"菅原 奏乃", grade:4 },
  { name:"野沢 有史", grade:4 },
  { name:"濱谷 龍希", grade:4 },
  { name:"安部 晴也", grade:4 },
  { name:"鈴木 凱斗", grade:4 },
  { name:"貝塚 大知", grade:4 },
  { name:"能戸 達己", grade:4 },
  { name:"河嶋 翔塁", grade:4 },

  { name:"鳴嶋 拓希", grade:3 },
  { name:"永田 涼", grade:3 },
  { name:"飛田 隆太", grade:3 },
  { name:"畑本 弘太", grade:3 }
];

const vehiclesMaster = [
  { name:"武田", capacity:4 },
  { name:"小路口", capacity:6 },
  { name:"杉山", capacity:3 },
  { name:"畑本", capacity:6 },
  { name:"近藤", capacity:3 },
  { name:"長谷", capacity:3 },
  { name:"杉野森", capacity:3 },
  { name:"菅原", capacity:3 },
  { name:"野沢", capacity:5 },
  { name:"安部", capacity:6 },
  { name:"鈴木", capacity:6 },
  { name:"貝塚", capacity:3 },
  { name:"能戸", capacity:5 },
  { name:"河嶋", capacity:5 },
  { name:"鳴嶋", capacity:1 },
  { name:"永田", capacity:5 },
  { name:"飛田", capacity:4 }
];

/* =====================
   保存処理
===================== */

function loadEvents() {
  return JSON.parse(localStorage.getItem("events") || "[]");
}
function saveEvents(events) {
  localStorage.setItem("events", JSON.stringify(events));
}

/* =====================
   画面制御
===================== */

function showSection(id) {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if (id === "list") renderList();
  if (id === "master") renderMaster();
}

function createNew() {
  const events = loadEvents();
  const ev = {
    id: Date.now(),
    title: "新しい配車",
    players: {},
    vehicles: {}
  };
  playersMaster.forEach(p => ev.players[p.name] = "未定");
  vehiclesMaster.forEach(v => ev.vehicles[v.name] = false);
  events.push(ev);
  saveEvents(events);
  openEditor(ev.id);
}

/* =====================
   一覧
===================== */

function renderList() {
  const list = document.getElementById("list");
  const events = loadEvents();
  list.innerHTML = "";
  events.forEach(ev => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="list-item">
        <strong>${ev.title}</strong>
        <button onclick="openEditor(${ev.id})">開く</button>
      </div>
    `;
    list.appendChild(div);
  });
}

/* =====================
   編集画面
===================== */

function openEditor(id) {
  const events = loadEvents();
  const ev = events.find(e => e.id === id);
  const ed = document.getElementById("editor");

  ed.innerHTML = `
    <div class="card">
      <input value="${ev.title}" onchange="evTitle(${id}, this.value)" />
    </div>

    <div class="card">
      <h3>選手出欠</h3>
      ${playersMaster.map(p => `
        <div class="list-item">
          ${p.name}（${p.grade}年）
          <select onchange="setPlayer(${id}, '${p.name}', this.value)">
            ${["出席","欠席","未定"].map(v =>
              `<option ${ev.players[p.name]===v?"selected":""}>${v}</option>`
            ).join("")}
          </select>
        </div>
      `).join("")}
    </div>

    <div class="card">
      <h3>車両提供</h3>
      ${vehiclesMaster.map(v => `
        <div class="list-item">
          ${v.name}（定員${v.capacity}）
          <input type="checkbox"
            ${ev.vehicles[v.name]?"checked":""}
            onchange="setVehicle(${id}, '${v.name}', this.checked)" />
        </div>
      `).join("")}
    </div>
  `;
  showSection("editor");
}

function evTitle(id, v) {
  const events = loadEvents();
  events.find(e => e.id===id).title = v;
  saveEvents(events);
}
function setPlayer(id, name, val) {
  const events = loadEvents();
  events.find(e => e.id===id).players[name] = val;
  saveEvents(events);
}
function setVehicle(id, name, val) {
  const events = loadEvents();
  events.find(e => e.id===id).vehicles[name] = val;
  saveEvents(events);
}

/* =====================
   マスター管理
===================== */

function renderMaster() {
  const m = document.getElementById("master");
  m.innerHTML = `
    <div class="card">
      <h3>選手マスター</h3>
      <button onclick="sortPlayers('grade')">学年順</button>
      <button onclick="sortPlayers('name')">名前順</button>
      ${playersMaster.map(p =>
        `<div class="list-item">${p.name}（${p.grade}年）</div>`
      ).join("")}
    </div>

    <div class="card">
      <h3>車両マスター</h3>
      <button onclick="sortVehicles('capacity')">定員順</button>
      <button onclick="sortVehicles('name')">名前順</button>
      ${vehiclesMaster.map(v =>
        `<div class="list-item">${v.name}（定員${v.capacity}）</div>`
      ).join("")}
    </div>
  `;
}

function sortPlayers(type) {
  playersMaster.sort((a,b) =>
    type==="grade" ? b.grade-a.grade : a.name.localeCompare(b.name)
  );
  renderMaster();
}
function sortVehicles(type) {
  vehiclesMaster.sort((a,b) =>
    type==="capacity" ? b.capacity-a.capacity : a.name.localeCompare(b.name)
  );
  renderMaster();
}

/* 初期表示 */
renderList();
</script>
</body>
</html>
