<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>配車管理アプリ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;margin:0;padding:10px}
h2,h3{margin:6px 0}
.section{background:#fff;border-radius:12px;padding:10px;margin-bottom:10px}
.flex{display:flex;gap:10px}
.card{flex:1;background:#fff;border-radius:12px;padding:10px}
.row{display:flex;align-items:center;gap:6px;padding:8px;border-bottom:1px solid #eee}
.row:last-child{border-bottom:none}
.big-btn{padding:10px;font-size:16px;border-radius:8px;border:none;color:#000;cursor:pointer}
.absent{background:#ffe5e5}
.btn-attend{background:#4da3ff}
.btn-absent{background:#ff6b6b}
.status-btn{padding:6px 10px;border-radius:8px;border:none;font-size:14px;color:#000;cursor:pointer}
.st-none{background:#ddd}
.st-ok{background:#4da3ff}
.st-ng{background:#ff6b6b}
.use-btn{padding:6px 10px;border-radius:8px;border:none;color:#000;cursor:pointer}
.use-on{background:#4caf50}
.use-off{background:#ccc}
.status-ok{color:green;font-weight:bold}
.status-ng{color:red;font-weight:bold}
.hidden{display:none}
input[type=number]{width:55px;font-size:16px}
</style>
</head>
<body>

<div id="mainScreen">
<h2>配車管理</h2>

<div class="section">
  <div class="row">
    <input type="date" id="date">
    <span id="weekday"></span>
  </div>
  <div class="row">
    <input type="text" id="eventName" placeholder="イベント名" style="width:100%">
  </div>
</div>

<div class="flex">
  <div class="card">
    <h3>選手出欠</h3>
    <div id="players"></div>
    出席人数：<strong><span id="attendCount">0</span>名</strong>
  </div>

  <div class="card">
    <h3>車両提供</h3>
    <div id="cars"></div>
  </div>
</div>

<div class="section">
  <h3>配車状況</h3>
  <div id="capacityStatus"></div>
</div>

<div class="section">
  <button class="big-btn" onclick="openMaster()">マスター管理</button>
</div>
</div>

<div id="masterScreen" class="hidden">
<h2>マスター管理</h2>

<div class="section">
<h3>選手マスター</h3>
<button onclick="sortPlayers()">学年順ソート</button>
<div id="masterPlayers"></div>
<button class="big-btn" onclick="addPlayer()">＋選手追加</button>
</div>

<div class="section">
<h3>車両マスター</h3>
<button onclick="sortCarsName()">名前順</button>
<button onclick="sortCarsCap()">定員順</button>
<div id="masterCars"></div>
<button class="big-btn" onclick="addCar()">＋車両追加</button>
</div>

<div class="section">
<button class="big-btn" onclick="closeMaster()">← 戻る</button>
</div>
</div>

<script>

/* ===== 正式基準データ ===== */

let playersMaster = JSON.parse(localStorage.getItem("playersMaster")) || [
{name:"小路口 悠太郎",grade:5},
{name:"杉山 朔弥",grade:5},
{name:"武田 諒太郎",grade:5},
{name:"近藤 諒平",grade:5},
{name:"畑本 颯太",grade:5},
{name:"長谷 紘希",grade:4},
{name:"杉野森 絃",grade:4},
{name:"菅原 奏奈",grade:4},
{name:"菅原 奏乃",grade:4},
{name:"野沢 有史",grade:4},
{name:"濱谷 龍希",grade:4},
{name:"安部 晴也",grade:4},
{name:"鈴木 凱斗",grade:4},
{name:"貝塚 大知",grade:4},
{name:"能戸 達己",grade:4},
{name:"河嶋 翔塁",grade:4},
{name:"鳴嶋 拓希",grade:3},
{name:"永田 涼",grade:3},
{name:"飛田 隆太",grade:3},
{name:"畑本 弘太",grade:3}
];

let carMaster = JSON.parse(localStorage.getItem("carMaster")) || [
{name:"武田",cap:4},
{name:"小路口",cap:6},
{name:"杉山",cap:3},
{name:"畑本",cap:6},
{name:"近藤",cap:3},
{name:"長谷",cap:3},
{name:"杉野森",cap:3},
{name:"菅原",cap:3},
{name:"野沢",cap:5},
{name:"安部",cap:6},
{name:"鈴木",cap:6},
{name:"貝塚",cap:3},
{name:"能戸",cap:5},
{name:"河嶋",cap:5},
{name:"鳴嶋",cap:1},
{name:"永田",cap:5},
{name:"飛田",cap:4}
];

/* ===== ユーティリティ ===== */

function gradeText(g){ return "小"+g; }

function openMaster(){
  mainScreen.classList.add("hidden");
  masterScreen.classList.remove("hidden");
  renderMaster();
}
function closeMaster(){
  localStorage.setItem("playersMaster",JSON.stringify(playersMaster));
  localStorage.setItem("carMaster",JSON.stringify(carMaster));
  location.reload();
}

function sortPlayers(){
  playersMaster.sort((a,b)=>b.grade-a.grade);
  renderMaster();
}
function sortCarsName(){
  carMaster.sort((a,b)=>a.name.localeCompare(b.name,"ja"));
  renderMaster();
}
function sortCarsCap(){
  carMaster.sort((a,b)=>b.cap-a.cap);
  renderMaster();
}

function renderMaster(){
  masterPlayers.innerHTML="";
  playersMaster.forEach((p,i)=>{
    masterPlayers.innerHTML+=`
    <div class="row">
      <input value="${p.name}" onchange="playersMaster[${i}].name=this.value">
      <input type="number" value="${p.grade}" style="width:60px" onchange="playersMaster[${i}].grade=Number(this.value)">
      <button onclick="playersMaster.splice(${i},1);renderMaster()">削除</button>
    </div>`;
  });

  masterCars.innerHTML="";
  carMaster.forEach((c,i)=>{
    masterCars.innerHTML+=`
    <div class="row">
      <input value="${c.name}" onchange="carMaster[${i}].name=this.value">
      定員 <input type="number" value="${c.cap}" onchange="carMaster[${i}].cap=Number(this.value)">
      <button onclick="carMaster.splice(${i},1);renderMaster()">削除</button>
    </div>`;
  });
}

function addPlayer(){
  playersMaster.push({name:"新規選手",grade:0});
  renderMaster();
}
function addCar(){
  carMaster.push({name:"新規家庭",cap:4});
  renderMaster();
}

/* ===== メイン画面 ===== */

function init(){
  playersMaster
    .sort((a,b)=>b.grade-a.grade)
    .forEach(p=>{
      players.innerHTML+=`
      <div class="row">
        <div style="flex:1">${p.name}（${gradeText(p.grade)}）</div>
        <button class="big-btn btn-attend" onclick="toggleAttend(this)">出席</button>
      </div>`;
    });

  carMaster.forEach(c=>{
    cars.innerHTML+=`
    <div class="row">
      <div style="width:60px">${c.name}</div>
      <button class="status-btn st-none" onclick="toggleStatus(this)">未回答</button>
      定員 <input type="number" min="1" max="8" placeholder="${c.cap}">
      <button class="use-btn use-off" onclick="toggleUse(this)">未使用</button>
    </div>`;
  });

  updateStatus();
}

function toggleAttend(btn){
  const row=btn.parentElement;
  if(btn.textContent==="出席"){
    btn.textContent="欠席";
    btn.className="big-btn btn-absent";
    row.classList.add("absent");
  }else{
    btn.textContent="出席";
    btn.className="big-btn btn-attend";
    row.classList.remove("absent");
  }
  updateStatus();
}

function toggleStatus(btn){
  const row=btn.parentElement;
  const useBtn=row.querySelector(".use-btn");

  if(btn.textContent==="未回答"){
    btn.textContent="配車可"; btn.className="status-btn st-ok";
    useBtn.disabled=false;
  }else if(btn.textContent==="配車可"){
    btn.textContent="配車不可"; btn.className="status-btn st-ng";
    useBtn.className="use-btn use-off";
    useBtn.textContent="未使用";
    useBtn.disabled=true;
  }else{
    btn.textContent="未回答"; btn.className="status-btn st-none";
    useBtn.disabled=false;
  }
  updateStatus();
}

function toggleUse(btn){
  if(btn.disabled) return;
  if(btn.classList.contains("use-off")){
    btn.className="use-btn use-on"; btn.textContent="使用";
  }else{
    btn.className="use-btn use-off"; btn.textContent="未使用";
  }
  updateStatus();
}

function updateStatus(){
  const attend=document.querySelectorAll("#players .row:not(.absent)").length;
  attendCount.textContent=attend;

  let cap=0,carsUsed=0;
  document.querySelectorAll("#cars .row").forEach(r=>{
    if(r.querySelector(".use-btn").classList.contains("use-on")){
      carsUsed++;
      cap+=Number(r.querySelector("input").value||r.querySelector("input").placeholder);
    }
  });

  if(cap<attend){
    capacityStatus.innerHTML=`
      出席 ${attend}名<br>
      実使用定員 ${cap}名<br>
      ${carsUsed}台配車<br>
      <span class="status-ng">⚠ ${attend-cap}名分 不足</span>
    `;
  }else{
    capacityStatus.innerHTML=`
      出席 ${attend}名<br>
      実使用定員 ${cap}名<br>
      ${carsUsed}台配車<br>
      <span class="status-ok">✓ 配車OK</span>
    `;
  }
}

init();
</script>
</body>
</html>
