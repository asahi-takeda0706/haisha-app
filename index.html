<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>配車管理アプリ（完成・最終安定版）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">

<style>
body { margin:0; font-family:system-ui,sans-serif; background:#f4f6f8; }
header { background:#4a90e2; color:#fff; padding:14px; font-size:20px; }
section { padding:14px; }
.button {
  background:#4a90e2; color:#fff;
  padding:12px; border-radius:8px;
  margin:10px 0; text-align:center; cursor:pointer;
}
.card {
  background:#fff; padding:12px;
  border-radius:8px; margin-bottom:8px;
}
.hidden { display:none; }
input {
  width:100%; padding:10px;
  margin-bottom:10px; font-size:16px;
}
.small { font-size:13px; color:#666; }
</style>
</head>

<body>

<header>配車管理アプリ</header>

<!-- 一覧画面 -->
<section id="screen-list">
  <h2>配車一覧</h2>
  <div id="eventList"></div>
  <div class="button" id="goCreate">＋ 新しい配車を作成</div>
</section>

<!-- 作成画面 -->
<section id="screen-create" class="hidden">
  <h2>新しい配車</h2>
  <input id="eventName" placeholder="イベント名">
  <input id="eventDate" type="date">
  <div class="button" id="saveEvent">保存</div>
  <div class="button" id="back">← 戻る</div>
</section>

<script>
(() => {

  /* ===== DOM ===== */
  const screenList   = document.getElementById("screen-list");
  const screenCreate = document.getElementById("screen-create");
  const eventList    = document.getElementById("eventList");

  const goCreate = document.getElementById("goCreate");
  const backBtn  = document.getElementById("back");
  const saveBtn  = document.getElementById("saveEvent");

  const eventName = document.getElementById("eventName");
  const eventDate = document.getElementById("eventDate");

  /* ===== 状態 ===== */
  let events = [];

  /* ===== 画面切替 ===== */
  function showList(){
    screenCreate.classList.add("hidden");
    screenList.classList.remove("hidden");
  }
  function showCreate(){
    screenList.classList.add("hidden");
    screenCreate.classList.remove("hidden");
  }

  /* ===== localStorage 正規化ロード ===== */
  function loadEvents(){
    let raw;
    try {
      raw = JSON.parse(localStorage.getItem("events"));
    } catch {
      raw = [];
    }

    if (!Array.isArray(raw)) raw = [];

    // undefined / 壊れた要素を完全排除
    events = raw.filter(e =>
      e &&
      typeof e === "object" &&
      typeof e.name === "string" &&
      typeof e.date === "string" &&
      e.name.trim() !== ""
    );

    // 初回 or 全滅時は必ず1件入れる
    if (events.length === 0) {
      events.push({
        name: "サンプル配車",
        date: new Date().toISOString().slice(0,10)
      });
    }

    saveEvents();
  }

  function saveEvents(){
    localStorage.setItem("events", JSON.stringify(events));
  }

  /* ===== 描画 ===== */
  function renderList(){
    eventList.innerHTML = "";

    events.forEach(e => {
      const name = e.name ?? "";
      const date = e.date ?? "";

      if (!name || !date) return; // 二重ガード

      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <strong>${name}</strong>
        <div class="small">${date}</div>
      `;
      eventList.appendChild(div);
    });
  }

  /* ===== イベント ===== */
  goCreate.onclick = showCreate;

  backBtn.onclick = () => {
    renderList();
    showList();
  };

  saveBtn.onclick = () => {
    const name = eventName.value.trim();
    const date = eventDate.value;

    if (!name || !date) {
      alert("イベント名と日付を入力してください");
      return;
    }

    events.push({ name, date });
    saveEvents();

    eventName.value = "";
    eventDate.value = "";

    renderList();
    showList();
  };

  /* ===== 起動 ===== */
  loadEvents();
  renderList();
  showList();

})();
</script>

</body>
</html>
