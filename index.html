<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>配車管理アプリ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>
body{margin:0;font-family:system-ui;background:#f3f4f6;}
header{background:#1e40af;color:#fff;padding:14px;font-size:20px;}
section{padding:16px;}
button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin:4px 4px 4px 0;
}
.blue{background:#2563eb;color:#fff;}
.gray{background:#6b7280;color:#fff;}
.green{background:#16a34a;color:#fff;}
.red{background:#dc2626;color:#fff;}
.yellow{background:#eab308;color:#000;}
.card{
  background:#fff;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.flex{display:flex;gap:6px;flex-wrap:wrap;}
.hidden{display:none;}
input,select{
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
}
.statusBtn{
  min-width:40px;
}
.active{outline:3px solid #000;}
hr{margin:24px 0;}
</style>
</head>
<body>

<header>配車管理アプリ</header>

<!-- ホーム -->
<section id="home">
  <button class="blue" onclick="showEvent()">+ 新しい配車を作成</button>
  <button class="blue" onclick="showMaster()">マスター管理</button>
</section>

<!-- マスター -->
<section id="master" class="hidden">
  <h2>選手マスター</h2>
  <div class="flex">
    <input id="playerName" placeholder="名前">
    <select id="playerGrade">
      <option value="1">1年</option>
      <option value="2">2年</option>
      <option value="3">3年</option>
    </select>
    <button class="blue" onclick="addPlayer()">追加</button>
    <button onclick="sortPlayers('grade')">学年順</button>
    <button onclick="sortPlayers('name')">名前順</button>
  </div>
  <div id="playerList"></div>

  <hr>

  <h2>車両マスター</h2>
  <div class="flex">
    <input id="carName" placeholder="車両名">
    <input id="carCapacity" type="number" placeholder="定員">
    <button class="blue" onclick="addCar()">追加</button>
    <button onclick="sortCars('capacity')">定員順</button>
    <button onclick="sortCars('name')">名前順</button>
  </div>
  <div id="carList"></div>

  <br>
  <button class="gray" onclick="goHome()">← 戻る</button>
</section>

<!-- イベント作成 -->
<section id="event" class="hidden">
  <h2>選手出欠入力</h2>
  <div id="attendanceList"></div>
  <br>
  <button class="gray" onclick="goHome()">← 戻る</button>
</section>

<script>
let players=[];
let cars=[];
let attendance={};

function load(){
  players=JSON.parse(localStorage.getItem("players"))||[];
  cars=JSON.parse(localStorage.getItem("cars"))||[];
}
function save(){
  localStorage.setItem("players",JSON.stringify(players));
  localStorage.setItem("cars",JSON.stringify(cars));
}

/* 画面切替 */
function showMaster(){
  hideAll();
  document.getElementById("master").classList.remove("hidden");
  renderPlayers();
  renderCars();
}
function showEvent(){
  hideAll();
  document.getElementById("event").classList.remove("hidden");
  renderAttendance();
}
function goHome(){
  hideAll();
  document.getElementById("home").classList.remove("hidden");
}
function hideAll(){
  document.getElementById("home").classList.add("hidden");
  document.getElementById("master").classList.add("hidden");
  document.getElementById("event").classList.add("hidden");
}

/* ===== マスター処理 ===== */
function addPlayer(){
  const name=playerName.value.trim();
  const grade=playerGrade.value;
  if(!name)return;
  players.push({name,grade:Number(grade)});
  playerName.value="";
  save();
  renderPlayers();
}
function deletePlayer(i){
  players.splice(i,1);
  save();
  renderPlayers();
}
function sortPlayers(type){
  if(type==="grade"){
    players.sort((a,b)=>a.grade-b.grade||a.name.localeCompare(b.name));
  }else{
    players.sort((a,b)=>a.name.localeCompare(b.name));
  }
  save();
  renderPlayers();
}
function renderPlayers(){
  playerList.innerHTML="";
  players.forEach((p,i)=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <div>${p.grade}年 ${p.name}</div>
      <button onclick="deletePlayer(${i})">削除</button>
    `;
    playerList.appendChild(div);
  });
}

function addCar(){
  const name=carName.value.trim();
  const capacity=carCapacity.value;
  if(!name||!capacity)return;
  cars.push({name,capacity:Number(capacity)});
  carName.value="";
  carCapacity.value="";
  save();
  renderCars();
}
function deleteCar(i){
  cars.splice(i,1);
  save();
  renderCars();
}
function sortCars(type){
  if(type==="capacity"){
    cars.sort((a,b)=>a.capacity-b.capacity);
  }else{
    cars.sort((a,b)=>a.name.localeCompare(b.name));
  }
  save();
  renderCars();
}
function renderCars(){
  carList.innerHTML="";
  cars.forEach((c,i)=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <div>${c.name}（定員${c.capacity}）</div>
      <button onclick="deleteCar(${i})">削除</button>
    `;
    carList.appendChild(div);
  });
}

/* ===== 出欠UI（最高UI復活） ===== */
function renderAttendance(){
  attendanceList.innerHTML="";
  players.forEach((p,i)=>{
    if(!attendance[p.name]) attendance[p.name]="none";

    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <div>${p.grade}年 ${p.name}</div>
      <div>
        <button class="statusBtn green ${attendance[p.name]==='yes'?'active':''}" onclick="setStatus('${p.name}','yes')">◯</button>
        <button class="statusBtn yellow ${attendance[p.name]==='maybe'?'active':''}" onclick="setStatus('${p.name}','maybe')">△</button>
        <button class="statusBtn red ${attendance[p.name]==='no'?'active':''}" onclick="setStatus('${p.name}','no')">×</button>
      </div>
    `;
    attendanceList.appendChild(div);
  });
}

function setStatus(name,status){
  attendance[name]=status;
  renderAttendance();
}

load();
</script>

</body>
</html>
