<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>配車管理アプリ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:system-ui;background:#f3f4f6;}
header{background:#1e3a8a;color:#fff;padding:16px;font-size:20px;}
section{padding:16px;}
button{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;margin:4px;}
.blue{background:#2563eb;color:#fff;}
.green{background:#16a34a;color:#fff;}
.gray{background:#6b7280;color:#fff;}
.red{background:#dc2626;color:#fff;}
.card{background:#fff;padding:10px;border-radius:10px;margin-bottom:8px;
display:flex;justify-content:space-between;align-items:center;}
.hidden{display:none;}
.active{outline:3px solid #000;}
h2{margin-top:0;}
.badge{background:#e5e7eb;padding:4px 8px;border-radius:6px;margin-left:6px;font-size:12px;}
</style>
</head>
<body>

<header>配車管理アプリ</header>

<section id="home">
  <button class="blue" onclick="showEvent()">+ 新しい配車を作成</button>
  <button class="blue" onclick="showMaster()">マスター管理</button>
</section>

<section id="master" class="hidden">
  <h2>選手マスター</h2>
  <div id="playerList"></div>
  <hr>
  <h2>車両マスター</h2>
  <div id="carList"></div>
  <br>
  <button class="gray" onclick="goHome()">← 戻る</button>
</section>

<section id="event" class="hidden">
  <h2>選手出欠入力</h2>
  <div id="attendanceList"></div>

  <h2>車両提供</h2>
  <div id="carSelect"></div>

  <br>
  <button class="green" onclick="autoAssign()">自動振分</button>
  <button class="gray" onclick="goHome()">← 戻る</button>

  <h2>振分結果</h2>
  <div id="result"></div>
</section>

<script>

/* ===== 初期データ ===== */

const players = [
{grade:5,name:"小路口 悠太郎"},
{grade:5,name:"杉山 朔弥"},
{grade:5,name:"武田 諒太郎"},
{grade:5,name:"近藤 諒平"},
{grade:5,name:"畑本 颯太"},
{grade:4,name:"長谷 紘希"},
{grade:4,name:"杉野森 絃"},
{grade:4,name:"菅原 奏奈"},
{grade:4,name:"菅原 奏乃"},
{grade:4,name:"野沢 有史"},
{grade:4,name:"濱谷 龍希"},
{grade:4,name:"安部 晴也"},
{grade:4,name:"鈴木 凱斗"},
{grade:4,name:"貝塚 大知"},
{grade:4,name:"能戸 達己"},
{grade:4,name:"河嶋 翔塁"},
{grade:3,name:"鳴嶋 拓希"},
{grade:3,name:"永田 涼"},
{grade:3,name:"飛田 隆太"},
{grade:3,name:"畑本 弘太"}
];

const cars = [
{name:"武田",capacity:4},
{name:"小路口",capacity:6},
{name:"杉山",capacity:3},
{name:"畑本",capacity:6},
{name:"近藤",capacity:3},
{name:"長谷",capacity:3},
{name:"杉野森",capacity:3},
{name:"菅原",capacity:3},
{name:"野沢",capacity:5},
{name:"安部",capacity:6},
{name:"鈴木",capacity:6},
{name:"貝塚",capacity:3},
{name:"能戸",capacity:5},
{name:"河嶋",capacity:5},
{name:"鳴嶋",capacity:1},
{name:"永田",capacity:5},
{name:"飛田",capacity:4}
];

let attendance = {};
let selectedCars = {};
let assignment = {};

/* ===== 画面制御 ===== */

function goHome(){
document.getElementById("home").classList.remove("hidden");
document.getElementById("master").classList.add("hidden");
document.getElementById("event").classList.add("hidden");
}

function showMaster(){
document.getElementById("home").classList.add("hidden");
document.getElementById("master").classList.remove("hidden");
renderMaster();
}

function showEvent(){
document.getElementById("home").classList.add("hidden");
document.getElementById("event").classList.remove("hidden");
renderAttendance();
renderCarSelect();
}

/* ===== マスター表示 ===== */

function renderMaster(){
const pList=document.getElementById("playerList");
pList.innerHTML="";
players.forEach((p,i)=>{
pList.innerHTML+=`
<div class="card">
<span>小${p.grade} ${p.name}</span>
<button class="red" onclick="deletePlayer(${i})">削除</button>
</div>`;
});

const cList=document.getElementById("carList");
cList.innerHTML="";
cars.forEach((c,i)=>{
cList.innerHTML+=`
<div class="card">
<span>${c.name} <span class="badge">${c.capacity}人</span></span>
<button class="red" onclick="deleteCar(${i})">削除</button>
</div>`;
});
}

function deletePlayer(i){
players.splice(i,1);
renderMaster();
}

function deleteCar(i){
cars.splice(i,1);
renderMaster();
}

/* ===== 出欠UI ===== */

function renderAttendance(){
const list=document.getElementById("attendanceList");
list.innerHTML="";
players.forEach(p=>{
attendance[p.name]="";
list.innerHTML+=`
<div class="card">
<span>小${p.grade} ${p.name}</span>
<div>
<button class="blue" onclick="setAttend('${p.name}','〇',this)">〇</button>
<button class="gray" onclick="setAttend('${p.name}','欠',this)">欠</button>
</div>
</div>`;
});
}

function setAttend(name,val,btn){
attendance[name]=val;
const parent=btn.parentNode;
Array.from(parent.children).forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
}

/* ===== 車両選択 ===== */

function renderCarSelect(){
const list=document.getElementById("carSelect");
list.innerHTML="";
cars.forEach(c=>{
selectedCars[c.name]=false;
list.innerHTML+=`
<div class="card">
<span>${c.name} (${c.capacity}人)</span>
<button class="green" onclick="toggleCar('${c.name}',this)">使用</button>
</div>`;
});
}

function toggleCar(name,btn){
selectedCars[name]=!selectedCars[name];
btn.classList.toggle("active");
}

/* ===== 自動振分 ===== */

function autoAssign(){
assignment={};
const attendPlayers=players.filter(p=>attendance[p.name]==="〇");
const usableCars=cars.filter(c=>selectedCars[c.name]);

usableCars.forEach(c=>assignment[c.name]=[]);

let carIndex=0;
attendPlayers.forEach(p=>{
if(usableCars.length===0)return;
let car=usableCars[carIndex];
if(assignment[car.name].length < car.capacity){
assignment[car.name].push(p.name);
}else{
carIndex++;
if(carIndex<usableCars.length){
assignment[usableCars[carIndex].name].push(p.name);
}
}
});

renderResult();
}

function renderResult(){
const r=document.getElementById("result");
r.innerHTML="";
for(let car in assignment){
r.innerHTML+=`<div class="card"><strong>${car}</strong><div>${assignment[car].join("<br>")}</div></div>`;
}
}

</script>
</body>
</html>
