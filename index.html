<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>配車管理アプリ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:system-ui;background:#f3f4f6;}
header{background:#1e40af;color:#fff;padding:14px;font-size:20px;}
section{padding:16px;}
button{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;margin:4px;}
.blue{background:#2563eb;color:#fff;}
.gray{background:#6b7280;color:#fff;}
.green{background:#16a34a;color:#fff;}
.yellow{background:#eab308;color:#000;}
.red{background:#dc2626;color:#fff;}
.card{background:#fff;padding:10px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hidden{display:none;}
.statusBtn{min-width:40px;}
.active{outline:3px solid #000;}
</style>
</head>
<body>

<header>配車管理アプリ</header>

<section id="home">
  <button class="blue" onclick="showEvent()">+ 新しい配車を作成</button>
  <button class="blue" onclick="showMaster()">マスター管理</button>
</section>

<section id="master" class="hidden">
  <h2>選手マスター</h2>
  <div id="playerList"></div>
  <hr>
  <h2>車両マスター</h2>
  <div id="carList"></div>
  <br>
  <button class="gray" onclick="goHome()">← 戻る</button>
</section>

<section id="event" class="hidden">
  <h2>選手出欠入力</h2>
  <div id="attendanceList"></div>
  <br>
  <button class="gray" onclick="goHome()">← 戻る</button>
</section>

<script>

/* ===== 初期データ固定 ===== */

const players = [
{grade:5,name:"小路口 悠太郎"},
{grade:5,name:"杉山 朔弥"},
{grade:5,name:"武田 諒太郎"},
{grade:5,name:"近藤 諒平"},
{grade:5,name:"畑本 颯太"},
{grade:4,name:"長谷 紘希"},
{grade:4,name:"杉野森 絃"},
{grade:4,name:"菅原 奏奈"},
{grade:4,name:"菅原 奏乃"},
{grade:4,name:"野沢 有史"},
{grade:4,name:"濱谷 龍希"},
{grade:4,name:"安部 晴也"},
{grade:4,name:"鈴木 凱斗"},
{grade:4,name:"貝塚 大知"},
{grade:4,name:"能戸 達己"},
{grade:4,name:"河嶋 翔塁"},
{grade:3,name:"鳴嶋 拓希"},
{grade:3,name:"永田 涼"},
{grade:3,name:"飛田 隆太"},
{grade:3,name:"畑本 弘太"}
];

const cars = [
{name:"武田",capacity:4},
{name:"小路口",capacity:6},
{name:"杉山",capacity:3},
{name:"畑本",capacity:6},
{name:"近藤",capacity:3},
{name:"長谷",capacity:3},
{name:"杉野森",capacity:3},
{name:"菅原",capacity:3},
{name:"野沢",capacity:5},
{name:"安部",capacity:6},
{name:"鈴木",capacity:6},
{name:"貝塚",capacity:3},
{name:"能戸",capacity:5},
{name:"河嶋",capacity:5},
{name:"鳴嶋",capacity:1},
{name:"永田",capacity:5},
{name:"飛田",capacity:4}
];

let attendance = {};

/* ===== 画面制御 ===== */

function hideAll(){
  home.classList.add("hidden");
  master.classList.add("hidden");
  event.classList.add("hidden");
}
function showMaster(){
  hideAll();
  master.classList.remove("hidden");
  renderPlayers();
  renderCars();
}
function showEvent(){
  hideAll();
  event.classList.remove("hidden");
  renderAttendance();
}
function goHome(){
  hideAll();
  home.classList.remove("hidden");
}

/* ===== マスター表示 ===== */

function renderPlayers(){
  playerList.innerHTML="";
  players
    .slice()
    .sort((a,b)=>b.grade-a.grade||a.name.localeCompare(b.name))
    .forEach(p=>{
      const div=document.createElement("div");
      div.className="card";
      div.textContent=`小${p.grade} ${p.name}`;
      playerList.appendChild(div);
    });
}

function renderCars(){
  carList.innerHTML="";
  cars
    .slice()
    .sort((a,b)=>a.name.localeCompare(b.name))
    .forEach(c=>{
      const div=document.createElement("div");
      div.className="card";
      div.textContent=`${c.name}（定員${c.capacity}人）`;
      carList.appendChild(div);
    });
}

/* ===== 出欠UI ===== */

function renderAttendance(){
  attendanceList.innerHTML="";
  players
    .slice()
    .sort((a,b)=>b.grade-a.grade||a.name.localeCompare(b.name))
    .forEach(p=>{
      if(!attendance[p.name]) attendance[p.name]="none";
      const div=document.createElement("div");
      div.className="card";
      div.innerHTML=`
        <div>小${p.grade} ${p.name}</div>
        <div>
          <button class="statusBtn green ${attendance[p.name]==='yes'?'active':''}" onclick="setStatus('${p.name}','yes')">◯</button>
          <button class="statusBtn yellow ${attendance[p.name]==='maybe'?'active':''}" onclick="setStatus('${p.name}','maybe')">△</button>
          <button class="statusBtn red ${attendance[p.name]==='no'?'active':''}" onclick="setStatus('${p.name}','no')">×</button>
        </div>
      `;
      attendanceList.appendChild(div);
    });
}

function setStatus(name,status){
  attendance[name]=status;
  renderAttendance();
}

</script>

</body>
</html>
